<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Manager - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f3f6fb;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem 3rem;
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
            max-width: 420px;
            width: 100%;
        }
        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.8rem;
            color: #0f172a;
            text-align: center;
        }
        p.subtitle {
            margin: 0 0 1.8rem;
            font-size: 0.95rem;
            color: #64748b;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 0.25rem;
            font-size: 0.95rem;
            color: #1e293b;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.7rem 0.9rem;
            margin-bottom: 1rem;
            border-radius: 10px;
            border: 1px solid #cbd5f5;
            font-size: 0.98rem;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.25);
        }
        .btn {
            border: none;
            border-radius: 999px;
            padding: 0.75rem 1.2rem;
            font-size: 0.98rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.15s ease, transform 0.05s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-1px);
        }
        .btn-ghost {
            background: transparent;
            color: #2563eb;
            margin-top: 0.5rem;
        }
        .btn-ghost:hover {
            background: rgba(37, 99, 235, 0.06);
        }
        .msg {
            font-size: 0.9rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .msg-error {
            color: #b91c1c;
        }
        .msg-info {
            color: #16a34a;
        }
        .small-link {
            margin-top: 0.75rem;
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
        }
        .small-link a {
            color: #2563eb;
            text-decoration: none;
        }
        .small-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to manage your expenses.</p>

    {% if error %}
        <div class="msg msg-error">{{ error }}</div>
    {% endif %}
    {% if info %}
        <div class="msg msg-info">{{ info }}</div>
    {% endif %}

    <form method="post" action="/login">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>

        <button class="btn btn-primary" type="submit">Log in</button>
    </form>

    <div class="small-link">
        New here?
        <a href="/signup">Create an account</a>
    </div>
</div>
</body>
</html>
