<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit expense</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(15, 23, 42, 0.9);
            border-radius: 18px;
            padding: 2rem 2.2rem;
            border: 1px solid rgba(148, 163, 184, 0.5);
            width: min(480px, 100% - 2rem);
            box-sizing: border-box;
        }
        h1 {
            margin: 0 0 1rem;
            font-size: 1.4rem;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }
        input[type="text"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 0.55rem 0.75rem;
            margin-bottom: 0.75rem;
            border-radius: 10px;
            border: 1px solid #4b5563;
            background: #020617;
            color: #e5e7eb;
            box-sizing: border-box;
            font-size: 0.92rem;
        }
        .btn {
            border-radius: 999px;
            border: none;
            padding: 0.55rem 1rem;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }
        .btn-primary {
            background: #22c55e;
            color: #022c22;
        }
        .btn-secondary {
            background: transparent;
            color: #e5e7eb;
            border: 1px solid rgba(148, 163, 184, 0.7);
        }
        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 0.75rem;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Edit expense</h1>
    <form method="post" action="/expenses/update/{{ expense.id }}">
        <label for="amount">Amount</label>
        <input id="amount" name="amount" type="number" step="0.01" min="0" required value="{{ expense.amount }}">

        <label for="category">Category</label>
        <select id="category" name="category" required>
            {% for cat in categories %}
                <option value="{{ cat }}" {% if expense.category == cat %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
        </select>

        <label for="description">Description</label>
        <input id="description" name="description" type="text" value="{{ expense.description }}">

        <label for="date_value">Date</label>
        <input id="date_value" name="date_value" type="date" value="{{ expense.date }}">

        <div class="actions">
            <a href="/main" class="btn btn-secondary">Cancel</a>
            <button class="btn btn-primary" type="submit">Save changes</button>
        </div>
    </form>
</div>
</body>
</html>
